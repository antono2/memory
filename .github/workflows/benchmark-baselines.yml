name: Benchmark baselines

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        shell: bash
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python modules/antono2/memory/scripts/test_compatibility.py
          python modules/antono2/memory/scripts/test_doctor.py
          python modules/antono2/memory/scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Record optimized benchmark baseline
        run: |
          {
            printf 'ref=%s commit=%s platform=%s/%s build=-prod\n' \
              "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
            ./scripts/run_benchmarks.sh 250000
          } | tee benchmark-results-${{ runner.os }}.txt
      - name: Upload benchmark baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-${{ github.run_id }}-${{ runner.os }}
          path: modules/antono2/memory/benchmark-results-${{ runner.os }}.txt
          if-no-files-found: error
          retention-days: 90
