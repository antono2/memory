name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prantlf/setup-v-action@v4
        with:
          version: 0.5.2
      - name: Verify formatting
        run: v fmt -verify .
      - name: Vet
        run: v vet .
      - name: Test
        run: v test .
      - name: Run examples
        run: ./scripts/run_examples.sh
      - name: Run deterministic benchmark smoke test
        run: ./scripts/run_benchmarks.sh --quick
