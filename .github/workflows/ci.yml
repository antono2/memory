name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Verify formatting
        run: v fmt -verify .
      - name: Vet
        run: v vet .
      - name: Validate public API documentation
        run: v doc -f none -m .
      - name: Test
        run: v test .
      - name: Run examples
        run: ./scripts/run_examples.sh
      - name: Run deterministic benchmark smoke test
        run: ./scripts/run_benchmarks.sh --quick | tee benchmark-smoke.txt
      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-benchmark-smoke-${{ github.run_id }}
          path: modules/antono2/memory/benchmark-smoke.txt
          if-no-files-found: error
          retention-days: 14

  platform-tests:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Run allocator tests
        run: v test .
      - name: Run public API examples
        run: |
          v run examples/object_pool
          v run examples/buffer_pool
          v run examples/range_allocator
          v run examples/linear_allocator
          v run examples/ring_allocator
          v run examples/buddy_allocator
          v run examples/synchronized_allocators

  sanitizers:
    name: Sanitizers / Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: ./scripts/run_sanitizers.sh
      - name: Run ThreadSanitizer on synchronized allocators
        run: ./scripts/run_thread_sanitizer.sh
