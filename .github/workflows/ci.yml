name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prantlf/setup-v-action@v4
        with:
          version: 0.5.2
      - name: Verify formatting
        run: v fmt -verify .
      - name: Vet
        run: v vet .
      - name: Test
        run: v test .
      - name: Run examples
        run: ./scripts/run_examples.sh
      - name: Run deterministic benchmark smoke test
        run: ./scripts/run_benchmarks.sh --quick

  platform-tests:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        working-directory: modules/antono2/mem
    steps:
      - uses: actions/checkout@v7
        with:
          path: modules/antono2/mem
      - uses: prantlf/setup-v-action@v4
        with:
          version: 0.5.2
      - name: Run allocator tests
        run: v test .
      - name: Run public API examples
        run: |
          v run examples/object_pool
          v run examples/buffer_pool
          v run examples/range_allocator
          v run examples/linear_allocator
          v run examples/ring_allocator
          v run examples/buddy_allocator
