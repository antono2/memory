name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run modules/antono2/memory/scripts/compatibility.vsh --self-test
          v run modules/antono2/memory/scripts/doctor.vsh --self-test
          v run modules/antono2/memory/scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Verify formatting
        run: v fmt -verify .
      - name: Vet
        run: v vet .
      - name: Validate public API documentation
        run: v doc -f none -m .
      - name: Test
        run: v test .
      - name: Run examples
        run: v run scripts/run_samples.vsh examples
      - name: Run deterministic benchmark smoke test
        shell: bash
        run: v run scripts/run_samples.vsh benchmarks --quick | tee benchmark-smoke.txt
      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-benchmark-smoke-${{ github.run_id }}
          path: modules/antono2/memory/benchmark-smoke.txt
          if-no-files-found: error
          retention-days: 14

  platform-tests:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VMODULES: ${{ github.workspace }}/modules
    defaults:
      run:
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run modules/antono2/memory/scripts/compatibility.vsh --self-test
          v run modules/antono2/memory/scripts/doctor.vsh --self-test
          v run modules/antono2/memory/scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Run allocator tests
        run: v test .
      - name: Run public API examples
        run: v run scripts/run_samples.vsh examples
      - name: Run quick allocator benchmarks
        run: v run scripts/run_samples.vsh benchmarks --quick

  pinned-v3:
    name: Pinned V / ordinary and strict V3 / Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/antono2/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/memory
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Resolve compiler pins
        id: compat
        run: v run scripts/compatibility.vsh --profile v3 --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v3_v }}
          path: .ci-v-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: .ci-v-source/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.v3_tcc }}
          path: .ci-v-source/thirdparty/tcc
      - name: Build pinned compiler with tool fallback
        run: make -C "$GITHUB_WORKSPACE/.ci-v-source" local=1
      - name: Verify both compiler modes and public consumers
        env:
          VEXE: ${{ github.workspace }}/.ci-v-source/v
          VJOBS: 4
        run: sh scripts/run_v3.sh

  sanitizers:
    name: Sanitizers / Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run ./scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run ./scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: ./scripts/run_sanitizers.sh
      - name: Run ThreadSanitizer on synchronized allocators
        run: ./scripts/run_thread_sanitizer.sh
